<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#4f46e5">
<title>PPOB Kasir</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ppob_theme')||'klasik';document.documentElement.dataset.fs=localStorage.getItem('ppob_fs')||'n'}catch(e){document.documentElement.dataset.theme='klasik'}</script>
<style>
:root{color-scheme:light only;--p:#4f46e5;--p2:#7c3aed;--bg:#f3f5fb;--card:#ffffff;--tx:#1e2235;--mut:#6b7280;--bd:#e6e9f2;--ok:#059669;--okbg:#d1fae5;--warn:#b45309;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;background:#f3f5fb}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:#fff;color-scheme:light}
b{font-weight:650}
.mut{color:var(--mut);font-size:13px}
.ok{color:var(--ok);font-weight:600}
.bad{color:var(--bad);font-weight:600}

/* layout */
.side{display:none;position:fixed;inset:0 auto 0 0;width:248px;background:#fff;border-right:1px solid var(--bd);padding:20px 14px;flex-direction:column;gap:6px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;padding:4px 10px 18px}
.brand i{font-style:normal;display:grid;place-items:center;width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:20px}
.nav{display:flex;align-items:center;gap:12px;border:0;background:none;padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:600;color:#4b5266;text-align:left;width:100%}
.nav:hover{background:#f1f2fb}
.nav.on{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.nav .cnt{margin-left:auto;background:var(--bad);color:#fff;border-radius:99px;padding:0 8px;font-size:12px;min-width:22px;text-align:center}
.side .sp{flex:1}
main{min-height:100vh}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 16px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.top h1{margin:0;font-size:19px;flex:1}
.top button{border:0;background:rgba(255,255,255,.2);color:#fff;border-radius:12px;width:40px;height:40px;cursor:pointer;font-size:18px}
#view{padding:16px;max-width:1100px;margin:0 auto}
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;overflow-x:auto;background:#fff;border-top:1px solid var(--bd);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:2px;scrollbar-width:none}
.bottom::-webkit-scrollbar{display:none}
.bottom .nav{flex:0 0 auto;flex-direction:column;gap:2px;width:auto;min-width:72px;padding:6px 8px;font-size:11px;align-items:center;position:relative;text-align:center}
.bottom .nav span.ic{font-size:20px}
.bottom .nav.on{box-shadow:none}
.bottom .nav .cnt{position:absolute;top:0;right:8px;margin:0;font-size:10px;min-width:18px;padding:0 5px}
@media(min-width:900px){.side{display:flex}.bottom,.top .out{display:none}main{margin-left:248px}#view{padding:24px}.top{padding:18px 24px}}
@media(max-width:899px){main{padding-bottom:90px}}

/* components */
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.stat .l{color:var(--mut);font-size:12.5px}
.stat .v{font-size:20px;font-weight:750;margin-top:4px;word-break:break-word}
.stat.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border:0}
.item,.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;box-shadow:0 1px 2px rgba(20,25,60,.04)}
.row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.row.s{margin-top:8px;align-items:center;flex-wrap:wrap}
.r{text-align:right}
.badge{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
.badge.g{background:var(--okbg);color:var(--ok)}
.badge.o{background:var(--warnbg);color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:650;cursor:pointer;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:10px}
.btn.ghost{background:#eef0fb;color:var(--p)}
.btn.red{background:var(--badbg);color:var(--bad)}
.btn.green{background:var(--okbg);color:var(--ok)}
.btn.wa{background:#dcfce7;color:#15803d;text-decoration:none;display:inline-block}
.sec{display:flex;align-items:center;justify-content:space-between;margin:20px 0 10px;gap:10px;flex-wrap:wrap}
.sec h2{margin:0;font-size:17px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
input,select,textarea{width:100%;border:1px solid var(--bd);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--p);box-shadow:0 0 0 3px rgba(79,70,229,.15)}
label.f{display:block;font-size:13px;font-weight:600;margin:12px 0 5px;color:#4b5266}
.empty{text-align:center;color:var(--mut);padding:36px 10px;background:#fff;border:1px dashed var(--bd);border-radius:var(--r)}

/* modal */
#confirm{position:fixed;inset:0;background:rgba(20,22,45,.5);display:none;align-items:center;justify-content:center;z-index:85;padding:18px}
#confirm.show{display:flex}
.cbox{background:#fff;border-radius:22px;padding:22px;width:min(380px,100%);text-align:center}
#modal{position:fixed;inset:0;background:rgba(20,22,45,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.show{display:flex}
.sheet{background:#fff;border-radius:22px;width:min(520px,100%);max-height:92vh;overflow:auto;padding:18px}
.sheet h3{margin:0 0 4px;font-size:18px}
.mfoot{display:flex;gap:10px;margin-top:18px}
.mfoot .btn{flex:1}
#busy{position:fixed;inset:0;background:rgba(255,255,255,.6);display:none;align-items:center;justify-content:center;z-index:80}
#busy.show{display:flex}
.spin{width:44px;height:44px;border:5px solid #dfe2f7;border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;top:18px;transform:translate(-50%,-160%);opacity:0;pointer-events:none;background:#111827;color:#fff;padding:12px 20px;border-radius:14px;z-index:90;transition:.3s;max-width:90vw;text-align:center;font-weight:600}
#toast.show{transform:translate(-50%,0);opacity:1}
#toast.err{background:var(--bad)}
#toast.good{background:var(--ok)}
#login{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--p),var(--p2));padding:20px}
#login.show{display:flex}
#login .box{background:#fff;border-radius:22px;padding:26px;width:min(380px,100%);text-align:center}
</style>
</head>
<body>
<div id="app">
  <aside class="side" id="side"></aside>
  <main>
    <header class="top">
      <h1><small id="hdrApp"></small><span id="title">Beranda</span></h1>
      <button id="btnSound" onclick="toggleSound()" title="Suara">🔊</button>
      <button onclick="reload()" title="Muat ulang">⟳</button>
      <button class="out" onclick="logout()" title="Keluar">🚪</button>
    </header>
    <div id="view"></div>
  </main>
  <nav class="bottom" id="bottom"></nav>
</div>

<div id="modal"><div class="sheet"><h3 id="mTitle"></h3><div id="mBody"></div>
  <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" id="mOk" onclick="submitModal()">Simpan</button></div></div></div>
<div id="busy"><div class="spin"></div></div>
<div id="confirm"><div class="cbox"><h3 id="cTitle">Konfirmasi</h3><p id="cMsg"></p>
  <div class="mfoot"><button class="btn ghost" id="cNo">Batal</button><button class="btn" id="cYes">Ya</button></div></div></div>
<div id="toast"></div>
<div id="login"><div class="box"><h2>🔐 PPOB Kasir</h2>
  <p class="mut">Masukkan PIN untuk masuk</p>
  <input id="pinIn" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Masuk</button></div></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwiJwddPtszCwX8FN_3xXKcDjYmI1QaUfv_k-SMPnSiddW9EoLlCHrc-fYI-DgIr7PY/exec'; // URL Web App Anda

const $ = s => document.querySelector(s);
const rp = n => 'Rp ' + Number(n || 0).toLocaleString('id-ID');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const ymd = () => new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Jakarta'});
const sum = (a, k) => a.reduce((s, x) => s + Number(x[k] || 0), 0);

let db = {customers:[], apps:[], products:[], trx:[], hutang:[]};
const sess = {
  get(k){ try{ return sessionStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ sessionStorage.setItem(k,v); }catch(e){} },
  del(k){ try{ sessionStorage.removeItem(k); }catch(e){} }
};
let page = 'hutang', pin = sess.get('ppob_pin') || '';
let soundOn = store.get('ppob_sound') !== '0';
let modalSubmit = null;

const NAV = [
  ['hutang','💸','Hutang Customer'], ['trx','🧾','Transaksi'], ['rekap','📊','Rekapitulasi']
];

async function api(action, data) {
  if (API_URL.indexOf('GANTI') >= 0) throw new Error('API_URL belum diisi');
  const r = await fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({action: action, pin: pin, data: data || {}})
  });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Terjadi kesalahan');
  return j.data;
}
function setBusy(b){ $('#busy').classList.toggle('show', b); }
let tt;
function toast(msg, type) {
  const t = $('#toast'); t.textContent = msg; t.className = 'show ' + (type || '');
  clearTimeout(tt); tt = setTimeout(() => t.className = '', 2600);
}
function setDb(d) { db = d; }
async function load() {
  setBusy(true);
  try { setDb(await api('getAll')); render(); }
  finally { setBusy(false); }
}
async function reload() {
  try { await load(); toast('Data dimuat ulang'); } catch (e) { toast(e.message, 'err'); }
}

function modal(title, html, onSubmit, okText) {
  $('#mTitle').textContent = title; $('#mBody').innerHTML = html;
  $('#mOk').textContent = okText || 'Simpan';
  modalSubmit = onSubmit; $('#modal').classList.add('show');
}
function closeModal() { $('#modal').classList.remove('show'); }
async function submitModal() {
  try {
    setBusy(true);
    const ok = await modalSubmit();
    if (ok !== false) closeModal();
  } catch (e) { toast(e.message, 'err'); }
  finally { setBusy(false); }
}
const field = (l, h) => '<label class="f">' + l + '</label>' + h;

function askConfirm(title, msg, okText, danger) {
  return new Promise(function (resolve) {
    $('#cTitle').textContent = title; $('#cMsg').textContent = msg || '';
    const y = $('#cYes'), n = $('#cNo'), box = $('#confirm');
    y.textContent = okText || 'Ya'; y.className = 'btn' + (danger ? ' dng' : '');
    box.classList.add('show');
    const done = function (v) { box.classList.remove('show'); y.onclick = n.onclick = box.onclick = null; resolve(v); };
    y.onclick = function () { done(true); };
    n.onclick = function () { done(false); };
    box.onclick = function (e) { if (e.target === box) done(false); };
  });
}

function fmtNum(v) { const d = String(v == null ? '' : v).replace(/\D/g, ''); return d ? Number(d).toLocaleString('id-ID') : ''; }
function numVal(sel) { return Number(String($(sel).value).replace(/\D/g, '')) || 0; }
function fmtInput(el) {
  const pos = el.selectionStart, before = el.value;
  const digitsBefore = before.slice(0, pos).replace(/\D/g, '').length;
  el.value = fmtNum(before);
  let i = 0, c = 0;
  while (i < el.value.length && c < digitsBefore) { if (/\d/.test(el.value[i])) c++; i++; }
  try { el.setSelectionRange(i, i); } catch (e) {}
}

async function doLogin() {
  pin = $('#pinIn').value.trim();
  if (!pin) return;
  try {
    await load();
    sess.set('ppob_pin', pin);
    $('#login').classList.remove('show');
  } catch (e) { toast(e.message, 'err'); $('#pinIn').value = ''; }
}
async function logout() {
  if (!(await askConfirm('Keluar?', 'Masukkan PIN lagi nanti.', 'Keluar', true))) return;
  sess.del('ppob_pin'); pin = ''; showLogin();
}
function showLogin() { $('#login').classList.add('show'); setTimeout(() => $('#pinIn').focus(), 50); }

function buildNav() {
  const mk = n => '<button class="nav" data-nav="' + n[0] + '" onclick="go(\'' + n[0] + '\')"><span class="ic">' + n[1] + '</span><span>' + n[2] + '</span></button>';
  $('#side').innerHTML = '<div class="brand"><i>💸</i>PPOB & Kasbon</div>' + NAV.map(mk).join('') +
    '<div class="sp"></div><button class="nav" onclick="logout()"><span class="ic">🚪</span><span>Keluar</span></button>';
  $('#bottom').innerHTML = NAV.map(mk).join('');
}
function go(p) { page = p; render(); window.scrollTo(0, 0); }

function render() {
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === page));
  $('#title').textContent = NAV.filter(n => n[0] === page)[0][2];
  const pages = {hutang: pHutang, trx: pTrx, rekap: pRekap};
  try { $('#view').innerHTML = pages[page](); } catch (e) { $('#view').innerHTML = '<div class="empty">Error</div>'; }
}

function waNum(t) { t = String(t || '').replace(/\D/g, ''); if (t.indexOf('0') === 0) t = '62' + t.slice(1); return t; }

/* ====== HALAMAN HUTANG CUSTOMER ====== */
function pHutang() {
  const hutangList = db.hutang || [];
  const aktif = hutangList.filter(h => h.status === 'Belum Lunas');
  const g = {};
  aktif.forEach(h => { (g[h.customerId] = g[h.customerId] || []).push(h); });
  const keys = Object.keys(g).sort((a, b) => sum(g[b], 'jumlah') - sum(g[a], 'jumlah'));

  return '<div class="stats"><div class="stat hero"><div class="l">Total Kasbon Aktif</div><div class="v">' + rp(sum(aktif, 'jumlah')) + '</div></div>' +
    '<div class="stat"><div class="l">Customer Pinjam</div><div class="v">' + keys.length + '</div></div></div>' +
    '<div class="tools"><button class="btn" onclick="hutangForm()">+ Catat Kasbon Baru</button></div>' +
    (!aktif.length ? '<div class="empty">🎉 Tidak ada customer yang memiliki kasbon aktif.</div>' :
    '<div class="grid">' + keys.map(function (cid) {
      const l = g[cid].slice().sort((a, b) => (b.tanggal + b.jam).localeCompare(a.tanggal + a.jam));
      const c = db.customers.filter(x => x.id === cid)[0], tot = sum(l, 'jumlah');
      const msg = 'Halo ' + l[0].customer + ', mengingatkan sisa kasbon Anda:\n' + l.map(h => '- ' + h.tanggal + ': ' + rp(h.jumlah) + (h.catatan ? ' (' + h.catatan + ')' : '')).join('\n') + '\nTotal: ' + rp(tot) + '\nTerima kasih.';
      return '<div class="card"><div class="row"><div><b>👤 ' + esc(l[0].customer) + '</b><div class="mut">' + esc(c ? (c.alamat || '') : '') + '</div></div><div class="r"><b class="bad">' + rp(tot) + '</b><div class="mut">' + l.length + ' catatan</div></div></div>' +
        '<div style="margin-top:10px">' + l.map(h => '<div class="row s" style="border-top:1px solid var(--bd);padding-top:8px"><div><div><b>' + rp(h.jumlah) + '</b> <span class="badge o">' + esc(h.status) + '</span></div><div class="mut">' + esc(h.tanggal) + (h.catatan ? ' • ' + esc(h.catatan) : '') + '</div></div>' +
        '<div class="r"><div class="acts" style="margin-top:0"><button class="btn sm green" onclick="payHutangIds([\'' + h.id + '\'])">Lunasi</button><button class="btn sm ghost" onclick="hutangForm(\'' + h.id + '\')">Edit</button><button class="btn sm red" onclick="delHutang(\'' + h.id + '\')">Hapus</button></div></div></div>').join('') + '</div>' +
        '<div class="acts" style="margin-top:14px"><button class="btn sm" onclick="payHutangIds(' + "['" + l.map(h => h.id).join("','") + "']" + ')">✔ Lunasi Semua (' + rp(tot) + ')</button>' +
        (c && c.telepon ? '<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/' + waNum(c.telepon) + '?text=' + encodeURIComponent(msg) + '">WhatsApp</a>' : '') + '</div></div>';
    }).join('') + '</div>');
}

function hutangForm(id) {
  const h = (db.hutang || []).filter(x => x.id === id)[0] || {};
  const isEdit = !!id;
  const ao = db.customers.map(c => '<option value="' + c.id + '"' + (c.id === h.customerId ? ' selected' : '') + '>' + esc(c.nama) + '</option>').join('');
  
  modal(isEdit ? 'Edit Kasbon Uang' : 'Catat Hutang / Kasbon Uang',
    field('Customer', '<select id="hCust">' + ao + '</select>') +
    field('Jumlah Uang (Rp)', '<input id="hJumlah" type="text" inputmode="numeric" autocomplete="off" oninput="fmtInput(this)" value="' + fmtNum(h.jumlah) + '">') +
    field('Catatan / Keperluan (opsional)', '<input id="hCatatan" value="' + esc(h.catatan) + '">'),
    async function () {
      const customerId = $('#hCust').value;
      if (!customerId) throw new Error('Pilih customer terlebih dahulu');
      const jumlah = numVal('#hJumlah');
      if (jumlah <= 0) throw new Error('Masukkan jumlah pinjaman yang valid');
      
      setDb(await api(isEdit ? 'editHutang' : 'addHutang', {id: id || '', customerId: customerId, jumlah: jumlah, catatan: $('#hCatatan').value.trim()}));
      render(); toast(isEdit ? 'Kasbon diperbarui' : 'Kasbon berhasil dicatat', 'good');
    }, isEdit ? 'Simpan Perubahan' : 'Simpan Kasbon');
}

async function payHutangIds(ids) {
  if (!(await askConfirm('Lunasi kasbon?', ids.length + ' catatan kasbon akan ditandai LUNAS.', 'Ya, Lunas'))) return;
  try { setBusy(true); setDb(await api('payHutang', {ids: ids})); render(); toast('✅ Kasbon berhasil dilunasi', 'good'); }
  catch (e) { toast(e.message, 'err'); } finally { setBusy(false); }
}

async function delHutang(id) {
  if (!(await askConfirm('Hapus catatan?', 'Catatan kasbon ini akan dihapus permanen.', 'Hapus', true))) return;
  try { setBusy(true); setDb(await api('deleteHutang', {id: id})); render(); toast('Catatan dihapus'); }
  catch (e) { toast(e.message, 'err'); } finally { setBusy(false); }
}

function pTrx() { return '<div class="sec"><h2>Transaksi & Kasbon Masuk Rekap</h2></div><div class="empty">Semua catatan kasbon dan transaksi tercatat otomatis di Google Sheet.</div>'; }
function pRekap() { return '<div class="sec"><h2>Rekapitulasi</h2></div><div class="empty">Cek lembar Rekapitulasi di file Google Spreadsheet utama Anda.</div>'; }
function toggleSound(){}

buildNav();
if (!pin) showLogin(); else load();
</script>
</body>
</html>
