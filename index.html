<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<meta name="theme-color" content="#4f46e5">
<title>PPOB Kasir</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ppob_theme')||'klasik';document.documentElement.dataset.fs=localStorage.getItem('ppob_fs')||'n'}catch(e){document.documentElement.dataset.theme='klasik'}</script>
<script src="js/tema-art.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside class="side" id="side"></aside>
  <main>
    <header class="top">
      <h1><small id="hdrApp"></small><span id="title">Beranda</span></h1>
      <button onclick="openThemes()" title="Tema">🎨</button>
      <button id="btnSound" onclick="toggleSound()" title="Suara">🔊</button>
      <button onclick="reload()" title="Muat ulang">⟳</button>
      <button class="out" onclick="logout()" title="Keluar">🚪</button>
    </header>
    <div id="view"></div>
  </main>
  <nav class="bottom" id="bottom"></nav>
</div>
<button class="fab" onclick="trxForm()" aria-label="Transaksi baru">+</button>

<div id="modal"><div class="sheet"><h3 id="mTitle"></h3><div id="mBody"></div>
  <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Batal</button><button class="btn" id="mOk" onclick="submitModal()">Simpan</button></div></div></div>
<div id="themes" onclick="if(event.target===this)closeThemes()"><div class="sheet"><h3>🎨 Pilih Tema</h3><div class="mut">Tampilan tersimpan di perangkat ini.</div><div class="tgrid" id="tgrid"></div><div class="mfoot"><button class="btn ghost" onclick="closeThemes()">Tutup</button></div></div></div>
<div id="printArea"></div><style id="pageStyle"></style>
<div id="busy"><div class="spin"></div></div>
<div id="confirm"><div class="cbox"><div class="cic" id="cIc">❓</div><h3 id="cTitle"></h3><p id="cMsg"></p>
  <div class="mfoot"><button class="btn ghost" id="cNo">Batal</button><button class="btn" id="cYes">Ya</button></div></div></div>
<div id="payAsk"><div class="cbox"><div class="cic">💳</div><h3>Status pembayaran?</h3><p id="payMsg"></p>
  <div class="paybtns"><button class="btn green" id="payL">✅ Lunas</button><button class="btn wr" id="payB">⏳ Belum Bayar</button></div><button class="btn ghost" id="payC" style="width:100%;margin-top:10px">Batal</button></div></div>
<div id="toast"></div>
<div id="login"><div class="box"><div class="big">🔐</div><h2 id="loginName" style="margin:6px 0">PPOB Kasir</h2><div class="mut" id="loginToko"></div>
  <p class="mut">Masukkan PIN untuk masuk</p>
  <input id="pinIn" type="password" inputmode="numeric" placeholder="PIN" onkeydown="if(event.key==='Enter')doLogin()">
  <button class="btn" style="width:100%;margin-top:14px" onclick="doLogin()">Masuk</button></div></div>

<script src="app.js" defer></script>
