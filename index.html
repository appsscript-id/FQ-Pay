<script>
/* ===================================================================
   TAMBAHAN v2.7  (tempel TEPAT SEBELUM tag </body> di index.html)
   - Menu Hutang (pelanggan berhutang ke toko, terpisah dari transaksi)
   - Menu Pengeluaran (uang laba yang diambil) + peringatan jika > total laba
   - Nada pembuka nomor 2 sampai 10 diganti baru (nomor 1 tetap)
   =================================================================== */

/* ---------- 1. Menu di sidebar & bawah ---------- */
NAV.splice(NAV.length - 1, 0, ['hutang', '💸', 'Hutang'], ['keluar', '📤', 'Pengeluaran']);

/* ---------- 2. Nada pembuka 2-10 (nomor 1 "Klasik Lembut" dipertahankan) ---------- */
INTROS.length = 1;
INTROS.push(
  {k: 'bintang', n: 'Bintang Berkelip', d: 'Dentingan cepat naik turun seperti bintang berkelip.', play: function (T) {
    const B = [[1, 1], [2.76, .4], [5.4, .15]], P = [72, 76, 79, 84, 88, 91, 96, 100];
    for (let r = 0; r < 3; r++) P.concat(P.slice(1, 7).reverse()).forEach((m, i) => T(midi(m + (r === 2 ? 5 : 0)), r * 2.3 + i * 0.15, 1.4, {parts: B, vol: 0.07, atk: 0.004}));
    [48, 55, 60, 64].forEach(m => T(midi(m), 0, 7, {vol: 0.05, atk: 1}));
    [60, 67, 72, 76, 79].forEach(m => T(midi(m), 6.8, 1.2, {parts: B, vol: 0.1, atk: 0.004}));
  }},
  {k: 'tropis', n: 'Pantai Tropis', d: 'Marimba riang bernuansa pantai, santai dan cerah.', play: function (T) {
    const M = {type: 'triangle', parts: [[1, 1], [4, .25]], vol: 0.16, atk: 0.004};
    [67, 71, 74, 71, 76, 74, 71, 67, 69, 72, 76, 72, 79, 76, 72, 69].forEach((m, i) => T(midi(m), i * 0.42, 0.5, M));
    [43, 50, 43, 50, 45, 52, 45, 52].forEach((m, i) => T(midi(m), i * 0.84, 0.7, {type: 'triangle', vol: 0.18, atk: 0.01}));
    [67, 71, 74, 79].forEach(m => T(midi(m), 6.9, 1.1, M));
  }},
  {k: 'dangdut', n: 'Dangdut Ceria', d: 'Suling dan kendang bernuansa dangdut yang meriah.', play: function (T, N) {
    const S = {parts: [[1, 1], [2, .2]], vol: 0.14, atk: 0.03};
    [[69, 0, .4], [72, .5, .4], [71, 1, .4], [69, 1.5, .4], [68, 2, .8], [69, 3, .4], [72, 3.5, .4], [76, 4, .4], [74, 4.5, .4], [72, 5, .4], [71, 5.5, .4], [69, 6, 1.4]]
      .forEach(x => T(midi(x[0]), x[1], x[2] + 0.3, S));
    for (let i = 0; i < 15; i++) {
      const t = i * 0.5;
      if (i % 4 === 0) T(98, t, 0.3, {vol: 0.5, atk: 0.003});
      else if (i % 4 === 2) { T(196, t, 0.15, {vol: 0.35, atk: 0.003}); N(t, 0.06, 0.12, 2500); }
      else if (i % 4 === 3) N(t, 0.04, 0.08, 5000);
    }
  }},
  {k: 'orkestra', n: 'Orkestra Mini', d: 'Gesekan string yang membesar lalu ditutup tabuhan megah.', play: function (T) {
    const V = {type: 'sawtooth', lp: 1400, parts: [[1, 1], [1.005, .8]], vol: 0.045, atk: 1.2};
    [[[48, 55, 64, 67], 0], [[53, 57, 65, 69], 2], [[55, 59, 67, 71], 4], [[48, 55, 60, 64, 67, 72], 6]].forEach(c => c[0].forEach(m => T(midi(m), c[1], c[1] === 6 ? 1.9 : 2.3, V)));
    [72, 76, 79, 77, 79, 83, 84].forEach((m, i) => T(midi(m), 0.8 + i * 0.9, 1.2, {type: 'triangle', parts: [[1, 1], [2, .3]], vol: 0.12, atk: 0.08}));
    T(midi(36), 6, 1.8, {vol: 0.5, atk: 0.005});
  }},
  {k: 'elektro', n: 'Elektro Pop', d: 'Denyut bass dan arpeggio synth yang energik.', play: function (T, N) {
    const A = [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
    for (let b = 0; b < 4; b++) for (let s = 0; s < 16; s++) {
      const t = b * 1.8 + s * 0.1125;
      T(midi(A[b][s % 4] + 12), t, 0.16, {type: 'square', lp: 3000, vol: 0.05, atk: 0.004});
      if (s % 4 === 0) { T(midi(A[b][0] - 24), t, 0.4, {type: 'sawtooth', lp: 600, vol: 0.22, atk: 0.005}); N(t, 0.05, 0.12, 6000); }
    }
    [72, 76, 79, 84].forEach(m => T(midi(m), 7.2, 0.7, {type: 'sawtooth', lp: 2500, vol: 0.06, atk: 0.01}));
  }},
  {k: 'harpa', n: 'Harpa Surga', d: 'Sapuan harpa lembut yang menenangkan.', play: function (T) {
    const H = {parts: [[1, 1], [2, .4], [3, .15]], vol: 0.1, atk: 0.005}, sc = [0, 4, 7, 11, 12, 16, 19, 23, 24];
    [[48, 0], [53, 2], [55, 4], [48, 6]].forEach(c => sc.forEach((o, i) => T(midi(c[0] + o), c[1] + i * 0.09, 2.4, H)));
    T(midi(96), 6.9, 1.1, H);
  }},
  {k: 'akustik', n: 'Gitar Akustik', d: 'Petikan gitar hangat ala lagu santai.', play: function (T) {
    const G = {type: 'triangle', parts: [[1, 1], [2, .5], [3, .25]], vol: 0.11, atk: 0.003};
    [[48, 55, 64, 67, 72], [45, 52, 60, 64, 69], [41, 48, 57, 60, 65], [43, 50, 59, 62, 67]].forEach((c, b) => {
      const t = b * 1.75;
      c.forEach((m, i) => { T(midi(m), t + i * 0.035, 1.5, G); T(midi(m), t + 0.875 + (4 - i) * 0.035, 1.2, G); });
    });
    [76, 79, 76, 74, 72, 74, 76, 72].forEach((m, i) => T(midi(m + 12), 0.35 + i * 0.875, 0.9, {type: 'triangle', vol: 0.12, atk: 0.004}));
    [48, 55, 64, 72, 76].forEach((m, i) => T(midi(m), 7 + i * 0.03, 1, G));
  }},
  {k: 'angkasa', n: 'Angkasa Luar', d: 'Nada melayang pelan seperti menjelajah ruang angkasa.', play: function (T) {
    const S = {type: 'sawtooth', parts: [[1, 1], [1.004, 1]], vol: 0.03, atk: 1.5, sweep: [200, 1800]};
    [[[36, 43, 51, 58], 0], [[34, 41, 50, 57], 3.5]].forEach(c => c[0].forEach(m => T(midi(m), c[1], 4, S)));
    [91, 98, 94, 103, 96, 100, 106].forEach((m, i) => T(midi(m), 0.7 + i * 1.0, 2, {parts: [[1, 1], [2.01, .3]], vol: 0.07, atk: 0.01}));
    T(midi(108), 7, 0.9, {vol: 0.05, atk: 0.005});
  }},
  {k: 'ceria', n: 'Parade Ceria', d: 'Irama baris-berbaris yang riang dengan tabuhan snare.', play: function (T, N) {
    [72, 72, 76, 79, 77, 76, 74, 72, 74, 77, 81, 79, 77, 76, 74, 72].forEach((m, i) => {
      const t = i * 0.45;
      T(midi(m), t, 0.4, {type: 'square', lp: 3500, vol: 0.06, atk: 0.005});
      N(t, 0.06, i % 2 ? 0.18 : 0.08, 3000);
      if (i % 2 === 0) T(midi(i % 8 < 4 ? 48 : 55), t, 0.3, {type: 'triangle', vol: 0.2, atk: 0.005});
    });
    [60, 64, 67, 72].forEach(m => T(midi(m), 7.2, 0.7, {type: 'square', lp: 3500, vol: 0.05, atk: 0.005}));
  }}
);

/* ---------- 3. HUTANG: pelanggan berhutang uang ke toko ---------- */
const HT = () => db.hutang || [];
const sisaH = h => Math.max(0, Number(h.jumlah) - Number(h.dibayar || 0));

function pHutang() {
  const l = HT().slice().sort((a, b) => ((sisaH(b) > 0) - (sisaH(a) > 0)) || String(b.tanggal).localeCompare(String(a.tanggal)));
  const aktif = l.filter(h => sisaH(h) > 0), who = {};
  aktif.forEach(h => who[h.customerId] = 1);
  return '<div class="tools"><button class="btn" onclick="hutangForm()">+ Hutang Pelanggan</button></div>' +
    '<div class="stats"><div class="stat hero"><div class="l">Total yang belum dibayar</div><div class="v">' + rp(aktif.reduce((s, h) => s + sisaH(h), 0)) + '</div></div>' +
    '<div class="stat"><div class="l">Pelanggan berhutang</div><div class="v">' + Object.keys(who).length + '</div></div>' +
    '<div class="stat"><div class="l">Sudah dibayar</div><div class="v ok">' + rp(sum(l, 'dibayar')) + '</div></div></div>' +
    (l.length ? '<div class="grid">' + l.map(h => {
      const s = sisaH(h), telat = s > 0 && h.tempo && String(h.tempo) < ymd();
      const pct = Math.min(100, Number(h.dibayar || 0) / (Number(h.jumlah) || 1) * 100);
      const c = db.customers.filter(x => x.id === h.customerId)[0];
      const msg = 'Halo ' + h.customer + ', mengingatkan hutang Anda' + (h.ket ? ' (' + h.ket + ')' : '') + ' sebesar ' + rp(h.jumlah) + ', sisa ' + rp(s) + '.' + (h.tempo ? ' Jatuh tempo ' + h.tempo + '.' : '') + '\nTerima kasih.' + (tokoName ? '\n— ' + tokoName : '');
      return '<div class="item"><div class="row"><div><b>👤 ' + esc(h.customer) + '</b><div class="mut">' + esc(h.ket || '-') + '</div><div class="mut">📅 ' + esc(h.tanggal) + (h.tempo ? ' • Tempo ' + esc(h.tempo) : '') + '</div></div>' +
        '<div class="r"><b>' + rp(h.jumlah) + '</b><div><span class="badge ' + (s ? 'o' : 'g') + '">' + (s ? (telat ? 'Lewat tempo' : 'Belum lunas') : 'Lunas') + '</span></div></div></div>' +
        '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
        '<div class="row s"><span class="mut">Sudah bayar ' + rp(h.dibayar || 0) + '</span><b class="' + (s ? 'bad' : 'ok') + '">Sisa ' + rp(s) + '</b></div>' +
        '<div class="acts">' + (s ? '<button class="btn sm green" onclick="bayarHutangForm(\'' + h.id + '\')">💵 Terima Bayar</button>' : '') +
        (s && c && c.telepon ? '<a class="btn sm wa" target="_blank" rel="noopener" href="https://wa.me/' + waNum(c.telepon) + '?text=' + encodeURIComponent(msg) + '">WhatsApp</a>' : '') +
        '<button class="btn sm ghost" onclick="hutangForm(\'' + h.id + '\')">Edit</button><button class="btn sm red" onclick="delItem(\'deleteHutang\',\'' + h.id + '\')">Hapus</button></div></div>';
    }).join('') + '</div>' : '<div class="empty">Belum ada catatan hutang pelanggan</div>');
}

function hutangForm(id) {
  const h = HT().filter(x => x.id === id)[0] || {};
  modal(id ? 'Edit Hutang' : 'Hutang Pelanggan Baru',
    field('Customer (ketik untuk mencari)', '<div class="cs"><input id="fCustTxt" type="text" autocomplete="off" placeholder="Ketik nama / HP / alamat" value="' + esc(h.customer) + '" oninput="custInput()" onfocus="custRender()"><input type="hidden" id="fCust" value="' + esc(h.customerId) + '"><div id="csList" class="cs-list"></div></div>') +
    field('Jumlah hutang', '<input id="hJml" type="text" inputmode="numeric" autocomplete="off" oninput="fmtInput(this)" value="' + fmtNum(h.jumlah) + '">') +
    field('Keterangan (opsional)', '<input id="hKet" placeholder="mis. pinjam uang, kurang bayar" value="' + esc(h.ket) + '">') +
    '<div class="two"><div>' + field('Tanggal', '<input id="hTgl" type="date" value="' + esc(h.tanggal || ymd()) + '">') + '</div><div>' + field('Jatuh tempo (opsional)', '<input id="hTempo" type="date" value="' + esc(h.tempo || '') + '">') + '</div></div>',
    async function () {
      stepCustomer();
      const jml = numVal('#hJml');
      if (!(jml > 0)) throw new Error('Jumlah hutang wajib diisi');
      setDb(await api('saveHutang', {id: id || '', customerId: $('#fCust').value, ket: $('#hKet').value, jumlah: jml, tanggal: $('#hTgl').value, tempo: $('#hTempo').value}));
      render(); toast('Hutang tersimpan', 'good');
    });
  tfReqCust = true;   // customer wajib dipilih
}

function bayarHutangForm(id) {
  const h = HT().filter(x => x.id === id)[0]; if (!h) return;
  const s = sisaH(h);
  modal('Terima Pembayaran — ' + h.customer,
    '<div class="mut">Sisa hutang: <b>' + rp(s) + '</b></div>' +
    field('Jumlah dibayar (boleh dicicil)', '<input id="bJml" type="text" inputmode="numeric" autocomplete="off" oninput="fmtInput(this)" value="' + fmtNum(s) + '">'),
    async function () {
      const j = numVal('#bJml');
      if (!(j > 0)) throw new Error('Jumlah bayar wajib diisi');
      if (j > s) throw new Error('Jumlah melebihi sisa hutang (' + rp(s) + ')');
      setDb(await api('bayarHutang', {id: id, jumlah: j}));
      render(); toast(j >= s ? '✅ Hutang lunas' : 'Pembayaran dicatat', 'good');
    }, 'Simpan');
}

/* ---------- 4. PENGELUARAN dari laba ---------- */
const PG = () => db.pengeluaran || [];
function keluarInfo() {
  const laba = sum(db.trx, 'laba'), k = sum(PG(), 'jumlah');
  return {laba: laba, k: k, sisa: laba - k, over: k > laba};
}
function keluarBanner() {
  const i = keluarInfo();
  return i.over ? '<div class="card" style="border-color:var(--bad);background:var(--badbg);margin-bottom:14px"><b class="bad">⚠️ Pengeluaran melebihi total laba!</b>' +
    '<div class="mut">Total pengeluaran ' + rp(i.k) + ' lebih besar dari total laba ' + rp(i.laba) + ' (kurang ' + rp(-i.sisa) + ').</div></div>' : '';
}
function pKeluar() {
  const i = keluarInfo(), l = PG().slice().sort((a, b) => String(b.tanggal).localeCompare(String(a.tanggal)));
  return keluarBanner() + '<div class="tools"><button class="btn" onclick="keluarForm()">+ Pengeluaran</button></div>' +
    '<div class="stats"><div class="stat"><div class="l">Total laba</div><div class="v ok">' + rp(i.laba) + '</div></div>' +
    '<div class="stat"><div class="l">Total pengeluaran</div><div class="v bad">' + rp(i.k) + '</div></div>' +
    '<div class="stat hero"><div class="l">Sisa laba</div><div class="v">' + rp(i.sisa) + '</div></div></div>' +
    (l.length ? '<div class="grid">' + l.map(x => '<div class="item"><div class="row"><div><b>' + esc(x.ket) + '</b><div class="mut">📅 ' + esc(x.tanggal) + '</div></div><b class="bad">- ' + rp(x.jumlah) + '</b></div>' +
      '<div class="acts"><button class="btn sm ghost" onclick="keluarForm(\'' + x.id + '\')">Edit</button><button class="btn sm red" onclick="delItem(\'deleteKeluar\',\'' + x.id + '\')">Hapus</button></div></div>').join('') + '</div>' : '<div class="empty">Belum ada pengeluaran</div>');
}
function keluarForm(id) {
  const x = PG().filter(p => p.id === id)[0] || {}, i = keluarInfo();
  modal(id ? 'Edit Pengeluaran' : 'Pengeluaran Baru',
    '<div class="mut">Sisa laba saat ini: <b>' + rp(i.sisa) + '</b></div>' +
    field('Keperluan (mis. Beli makanan)', '<input id="kKet" value="' + esc(x.ket) + '">') +
    field('Jumlah diambil dari laba', '<input id="kJml" type="text" inputmode="numeric" autocomplete="off" oninput="fmtInput(this)" value="' + fmtNum(x.jumlah) + '">') +
    field('Tanggal', '<input id="kTgl" type="date" value="' + esc(x.tanggal || ymd()) + '">'),
    async function () {
      const ket = $('#kKet').value.trim(), jml = numVal('#kJml');
      if (!ket) throw new Error('Keperluan wajib diisi');
      if (!(jml > 0)) throw new Error('Jumlah wajib diisi');
      const sisaNanti = i.laba - (i.k - Number(x.jumlah || 0) + jml);
      if (sisaNanti < 0 && !(await askConfirm('Melebihi total laba!', 'Pengeluaran ini membuat sisa laba kurang ' + rp(-sisaNanti) + '. Tetap simpan?', 'Tetap simpan', '⚠️', true))) return false;
      setDb(await api('saveKeluar', {id: id || '', ket: ket, jumlah: jml, tanggal: $('#kTgl').value}));
      render();
      if (keluarInfo().over) { toast('⚠️ Pengeluaran melebihi total laba!', 'err'); sayBerhasil('Peringatan. Pengeluaran melebihi laba'); }
      else toast('Tersimpan. Sisa laba ' + rp(keluarInfo().sisa), 'good');
    });
}

/* ---------- 5. Pasang ke aplikasi ---------- */
const _pHomeAsli = pHome;
pHome = function () { return keluarBanner() + _pHomeAsli(); };

function render() {
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === page));
  $('#title').textContent = NAV.filter(n => n[0] === page)[0][2];
  const pages = {home: pHome, trx: pTrx, unpaid: pUnpaid, cust: pCust, apps: pApps, prod: pProd, rekap: pRekap, laba: pLaba, hutang: pHutang, keluar: pKeluar, set: pSet};
  try { $('#view').innerHTML = pages[page](); }
  catch (e) { $('#view').innerHTML = '<div class="empty">Gagal menampilkan halaman: ' + esc(e.message) + '</div>'; }
  if (page === 'set') drawThemes();
  const nb = db.trx.filter(t => t.status === 'Belum Bayar').length;
  document.querySelectorAll('[data-cnt]').forEach(e => { e.textContent = nb; e.style.display = nb ? '' : 'none'; });
}

buildNav();
render();
</script>
